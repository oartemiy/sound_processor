name: Release

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            exe: sound_processor.exe
            artifact: sound_processor-windows.exe
          - os: ubuntu-latest
            exe: sound_processor
            artifact: sound_processor-linux
          - os: macos-latest
            exe: sound_processor
            artifact: sound_processor-macos

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Locate executable (Windows)
        if: runner.os == 'Windows'
        run: |
          Get-ChildItem -Path build -Filter ${{ matrix.exe }} -Recurse | Copy-Item -Destination .

      - name: Locate executable (Unix)
        if: runner.os != 'Windows'
        run: |
          find build -name "${{ matrix.exe }}" -type f -exec cp {} . \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.exe }}